[project]
name = "raman-phase-finder"
version = "1.0.1"
description = "Raman Phase Finder spectroscopy search-match toolkit."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pybaselines",
    "pyqtgraph==0.14.0",
    "PySide6==6.7.3",
    "certifi",
    "pyreadr",
    "rdata",
    "ijson>=3.3,<4",
]

[project.optional-dependencies]
formats = [
    "ramanchada2>=1.3.1,<2",
    "pyarrow>=14",
]
research = [
    "pyarrow>=14",
]

[project.scripts]
raman-phase-finder-gui = "vibrational_finder.apps.finder_gui_release:main"
raman-finder = "vibrational_finder.apps.raman_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "Vibrational_Finder"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["Vibrational_Finder"]
include = ["vibrational_finder", "vibrational_finder.*"]
exclude = ["vibrational_finder.benchmark*"]
namespaces = false

[tool.setuptools.package-data]
"vibrational_finder.ui" = ["assets/*.svg"]

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]
